# Runs the tests on every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # The Python tests use only the standard library: no Pi, ANT+ stick or pedals needed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest -v

  browser:
    # Opens the dashboard and the ride list in headless Chromium with the simulator,
    # fails on any JavaScript error, and keeps screenshots of every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        env:
          REQUIRE_BROWSER: "1"
          SCREENSHOT_DIR: screenshots
        run: python -m unittest -v tests.test_browser
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
