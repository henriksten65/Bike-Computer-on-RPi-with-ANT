# Type checking: pip install mypy, then run  mypy
[mypy]
files = bikecomputer.py, ride.py, ridelog.py, sources.py, tests
python_version = 3.10
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True

# Optional libraries without type information (only needed for some sources / tests).
[mypy-openant.*,bleak.*,usb.*,playwright.*]
ignore_missing_imports = True
