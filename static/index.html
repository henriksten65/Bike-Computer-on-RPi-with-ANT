<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111110">
<title>Bike Computer</title>
<style>
  :root {
    color-scheme: dark;
    --bg:            #111110;
    --surface-1:     #1a1a19;
    --surface-2:     #242422;
    --border:        #34332f;
    --text-primary:  #f0efec;
    --text-secondary:#c3c2b7;
    --text-muted:    #8d8c84;
    --grid:          #2c2b28;
    --series-total:  #199e70;   /* aqua  */
    --series-left:   #3987e5;   /* blue  */
    --series-right:  #d95926;   /* orange */
    --series-hr:     #d6409f;   /* magenta */
    --ok:            #0ca30c;
    --warn:          #c98500;
    --bad:           #e5484d;
    /* power zones 1-7 */
    --z1: #8e8d87; --z2: #3b82f6; --z3: #22a06b; --z4: #e0b000;
    --z5: #f07a1a; --z6: #e5484d; --z7: #a35ee8;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg:            #f3f3f1;
      --surface-1:     #fcfcfb;
      --surface-2:     #efeeeb;
      --border:        #dcdbd6;
      --text-primary:  #0b0b0b;
      --text-secondary:#52514e;
      --text-muted:    #75746f;
      --grid:          #e6e5e1;
      --series-total:  #1baf7a;
      --series-left:   #2a78d6;
      --series-right:  #eb6834;
      --series-hr:     #c22d8a;
      --ok:            #008300;
      --warn:          #b07000;
      --bad:           #c62a2f;
      --z1: #75746f; --z2: #2563eb; --z3: #148a5a; --z4: #b38b00;
      --z5: #d9640a; --z6: #c62a2f; --z7: #8a45cf;
    }
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    gap: 10px;
    overflow-x: hidden;
  }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-secondary); margin-right: auto; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .alert {
    display: none; border: 1px solid var(--bad); border-radius: 8px; padding: 8px 12px;
    font-size: 14px; color: var(--text-primary); background: var(--surface-1);
  }
  .alert.show { display: block; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button, .btn {
    background: var(--surface-1); color: var(--text-secondary); border: 0;
    font: inherit; font-size: 14px; padding: 8px 12px; cursor: pointer; min-height: 36px;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }
  .btn { border: 1px solid var(--border); border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; }

  .tiles { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; }
  .tiles.has-hr { grid-template-columns: 1fr 1.4fr 1fr 1fr; }
  .tile.hr { display: none; }
  .tiles.has-hr .tile.hr { display: block; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; min-width: 0;
  }
  .label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; }
  .value { font-weight: 700; line-height: 1.05; white-space: nowrap; }
  .value small { font-size: .38em; font-weight: 500; color: var(--text-secondary); margin-left: .2em; }
  .big   { font-size: clamp(56px, 10vw, 104px); }
  .mid   { font-size: clamp(28px, 6vw, 64px); }
  /* the intense interval going on (HIIT), under the ride time */
  .intense { margin-top: 4px; font-weight: 700; font-size: clamp(18px, 3.6vw, 36px); color: var(--z6); white-space: nowrap; }
  .intense small { font-size: .5em; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-right: .4em; vertical-align: .2em; }

  .lr { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; }
  .lr .side { min-width: 0; }
  .lr .side.right { text-align: right; }
  .key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
  .balance { position: relative; height: 18px; border-radius: 9px; overflow: hidden; display: flex; gap: 2px; background: var(--surface-1); }
  .balance .bl { background: var(--series-left);  transition: flex-basis .4s; }
  .balance .br { background: var(--series-right); transition: flex-basis .4s; }
  .balance .mid50 { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--text-primary); opacity: .6; }
  .baltext { text-align: center; font-size: 14px; color: var(--text-secondary); margin-top: 6px; }

  .btn.lap { color: var(--text-primary); font-weight: 600; border-color: var(--text-muted); min-width: 64px; justify-content: center; }
  .btn.lap.flash { background: var(--surface-2); }
  .zone {
    display: none; margin-left: 8px; padding: 1px 8px; border-radius: 999px; font-size: 12px;
    letter-spacing: .03em; text-transform: none; color: var(--text-primary);
    border: 1px solid var(--zc, var(--border)); background: var(--surface-2);
  }
  .zone.show { display: inline-block; }
  .zone::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--zc); margin-right: 6px; vertical-align: 0; }
  .lapline { color: var(--text-primary); }
  .laps { overflow-x: auto; }
  .laps table { border-collapse: collapse; width: 100%; font-size: 14px; white-space: nowrap; }
  .laps th { text-align: right; color: var(--text-muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 4px 10px; border-bottom: 1px solid var(--border); }
  .laps td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--grid); }
  .laps th:first-child, .laps td:first-child { text-align: left; }
  .laps tr.now td { color: var(--text-secondary); }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; color: var(--text-secondary); }
  .stats b { color: var(--text-primary); font-weight: 600; }

  .chart { flex: 1; min-height: 220px; position: relative; padding: 10px 6px 6px 6px; display: flex; flex-direction: column; }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-secondary); padding: 0 8px 6px; flex-wrap: wrap; }
  .legend .key { width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; }
  .legend .grow { flex: 1; }
  .legend .seg button { font-size: 13px; padding: 4px 10px; min-height: 30px; }
  .legend > button { font: inherit; color: inherit; background: none; border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  .legend > button[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
  .legend > button[aria-pressed="false"] .key { background: var(--text-muted) !important; }
  .zonebar { font-size: 13px; color: var(--text-secondary); }
  .zonebar .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 1px; background: var(--surface-2); }
  .zonebar .bar div { min-width: 2px; }
  .zonebar .keys { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
  .zonebar .keys span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--zc); margin-right: 5px; }
  .legend > span { padding: 3px 0; }
  .plot { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .tip {
    position: absolute; pointer-events: none; display: none; z-index: 2;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; color: var(--text-primary); white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .tip .row { display: flex; justify-content: space-between; gap: 14px; }
  .tip .row span:first-child { color: var(--text-secondary); }

  @media (max-width: 640px) {
    .tiles { grid-template-columns: 1fr 1fr; }
    .tiles .power { grid-column: 1 / -1; order: -1; }
    .tiles.has-hr { grid-template-columns: 1fr 1fr 1fr; }
    .tiles.has-hr .mid { font-size: clamp(24px, 7.5vw, 40px); }
  }
</style>
</head>
<body>
  <header>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
    <button class="btn lap" id="lap" title="Finish this lap and start the next">Lap</button>
    <button class="btn" id="reset">Reset</button>
    <a class="btn" href="/rides">Rides</a>
  </header>

  <div class="alert" id="alert" role="alert"></div>

  <section class="tiles" id="tiles">
    <div class="tile">
      <div class="label">Time</div>
      <div class="value mid" id="time">0:00</div>
      <div class="intense" id="intense" title="How long this intense interval has lasted" hidden><small>Hard</small><span id="intenseT"></span></div>
    </div>
    <div class="tile power">
      <div class="label">Power<span class="zone" id="zone"></span></div>
      <div class="value big" id="power">—<small>W</small></div>
    </div>
    <div class="tile">
      <div class="label">Cadence</div>
      <div class="value mid" id="cad">—<small>rpm</small></div>
    </div>
    <div class="tile hr">
      <div class="label">Heart rate</div>
      <div class="value mid" id="hr">—<small>bpm</small></div>
    </div>
  </section>

  <section class="tile lr">
    <div class="side">
      <div class="label"><span class="key" style="background:var(--series-left)"></span>Left</div>
      <div class="value mid" id="left">—<small>W</small></div>
    </div>
    <div>
      <div class="balance" aria-hidden="true"><div class="bl" id="bl" style="flex-basis:50%"></div><div class="br" id="br" style="flex-basis:50%"></div><div class="mid50"></div></div>
      <div class="baltext" id="baltext">L — / R —</div>
    </div>
    <div class="side right">
      <div class="label">Right<span class="key" style="background:var(--series-right);margin:0 0 0 6px"></span></div>
      <div class="value mid" id="right">—<small>W</small></div>
    </div>
  </section>

  <section class="stats" id="stats" title="NP = normalized power: like the average, but weights hard efforts more. IF = NP ÷ FTP. TSS = training load: 100 = one hour at FTP."></section>
  <section class="zonebar" id="zonebar" hidden></section>
  <section class="stats lapline" id="lapline"></section>

  <section class="tile chart">
    <div class="legend">
      <span><span class="key" style="background:var(--series-total)"></span>Total</span>
      <button type="button" id="showL" title="Show or hide the left pedal line"><span class="key" style="background:var(--series-left)"></span>Left</button>
      <button type="button" id="showR" title="Show or hide the right pedal line"><span class="key" style="background:var(--series-right)"></span>Right</button>
      <button type="button" id="showH" title="Show or hide the heart rate line (its own scale)" hidden><span class="key" style="background:var(--series-hr)"></span>HR</button>
      <span class="grow"></span>
      <div class="seg" id="smooth" title="Smoothing for the big numbers">
        <button data-v="1" aria-pressed="false">1s</button>
        <button data-v="3" aria-pressed="true">3s</button>
      </div>
      <div class="seg" id="win" title="Graph window">
        <button data-v="60">1m</button>
        <button data-v="300">5m</button>
        <button data-v="600">10m</button>
        <button data-v="1200">20m</button>
        <button data-v="0">All</button>
      </div>
    </div>
    <div class="plot" id="plot">
      <canvas id="cv" aria-label="Power over time: total, left and right pedal"></canvas>
      <div class="tip" id="tip"></div>
    </div>
  </section>

  <section class="tile laps" id="laps" hidden></section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let history = [];          // samples recorded while moving
  let latest = null;         // last sample from server
  let windowS = 300;
  let smoothS = 3;
  let hoverX = null;
  let showL = true, showR = true, showH = true;   // left/right pedal and heart rate lines on the graph

  // ---------- persisted preferences (best effort)
  try {
    const w = localStorage.getItem("bc.win"); if (w !== null) windowS = +w;
    const s = localStorage.getItem("bc.smooth"); if (s !== null) smoothS = +s;
    showL = localStorage.getItem("bc.showL") !== "0";
    showR = localStorage.getItem("bc.showR") !== "0";
    showH = localStorage.getItem("bc.showH") !== "0";
  } catch (e) {}
  function setupToggle(id, key, get, set) {
    const b = $(id);
    const sync = () => b.setAttribute("aria-pressed", String(get()));
    b.onclick = () => { set(!get()); sync(); try { localStorage.setItem(key, get() ? "1" : "0"); } catch (e) {} render(); };
    sync();
  }
  setupToggle("showL", "bc.showL", () => showL, v => showL = v);
  setupToggle("showR", "bc.showR", () => showR, v => showR = v);
  setupToggle("showH", "bc.showH", () => showH, v => showH = v);
  function setupSeg(id, get, set) {
    const btns = [...$(id).querySelectorAll("button")];
    const sync = () => btns.forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === get())));
    btns.forEach(b => b.onclick = () => { set(+b.dataset.v); sync(); render(); });
    sync();
  }
  setupSeg("win", () => windowS, v => { windowS = v; try { localStorage.setItem("bc.win", v); } catch (e) {} });
  setupSeg("smooth", () => smoothS, v => { smoothS = v; try { localStorage.setItem("bc.smooth", v); } catch (e) {} });

  $("reset").onclick = () => {
    if (confirm("Reset the ride? (timer, graph and averages)")) post("/api/reset");
  };

  // POSTs must carry this header; the server rejects POSTs from other web pages.
  function post(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Bike-Computer": "1" },
      body: JSON.stringify(body || {}),
    }).catch(() => {});
  }
  // The Pi has no battery-backed clock; give it the phone's time for ride file names.
  const sendClock = () => post("/api/clock", { now: Date.now() });

  // ---------- formatting
  const fmtTime = s => {
    s = Math.floor(s || 0);
    const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
  };
  const num = (v, unit) => `${v == null ? "—" : Math.round(v)}<small>${unit}</small>`;
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  // ---------- power zones (share of FTP; same limits as ride.py)
  const ZONES = [[1, "Recovery", .55], [2, "Endurance", .75], [3, "Tempo", .90], [4, "Threshold", 1.05],
                 [5, "VO2 max", 1.20], [6, "Anaerobic", 1.50], [7, "Neuromuscular", Infinity]];
  const zoneOf = (p, ftp) => ftp && p != null ? ZONES.find(z => p <= z[2] * ftp) : null;

  // ---------- numbers
  function smoothed() {
    // Average of the last `smoothS` seconds; falls back to the live sample when stopped.
    if (!latest) return null;
    if (!latest.moving || smoothS <= 1 || history.length === 0) return latest;
    const tail = history.slice(-smoothS);
    const avg = k => {
      const v = tail.map(s => s[k]).filter(x => x != null);
      return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
    };
    return { p: avg("p"), l: avg("l"), r: avg("r"), c: avg("c"), h: latest.h };
  }

  function renderNumbers() {
    if (!latest) return;
    const st = latest.stats || {};
    const ftp = st.ftp;
    $("time").textContent = fmtTime(st.elapsed);
    // An intense interval going on: its own timer, gone when it ends.
    $("intense").hidden = st.intense_s == null;
    if (st.intense_s != null) $("intenseT").textContent = fmtTime(st.intense_s);
    const s = smoothed();
    $("power").innerHTML = num(s.p, "W");
    const z = latest.moving ? zoneOf(s.p, ftp) : null;
    $("zone").classList.toggle("show", !!z);
    if (z) { $("zone").textContent = `Z${z[0]} ${z[1]}`; $("zone").style.setProperty("--zc", `var(--z${z[0]})`); }
    $("cad").innerHTML = num(s.c, "rpm");
    // Show the heart rate tile once a strap has been seen in this ride.
    if (latest.h != null || st.avg_hr != null) $("tiles").classList.add("has-hr");
    $("hr").innerHTML = num(latest.h, "bpm");
    $("left").innerHTML = num(s.l, "W");
    $("right").innerHTML = num(s.r, "W");
    const tot = (s.l || 0) + (s.r || 0);
    if (s.l != null && tot > 0) {
      const lp = Math.round(100 * s.l / tot);
      $("bl").style.flexBasis = lp + "%";
      $("br").style.flexBasis = (100 - lp) + "%";
      $("baltext").textContent = `L ${lp}% / R ${100 - lp}%`;
    } else {
      $("baltext").textContent = "L — / R —";
    }
    const balTot = (st.avg_l || 0) + (st.avg_r || 0);
    const avgBal = balTot > 0 ? `${Math.round(100 * st.avg_l / balTot)}/${Math.round(100 * st.avg_r / balTot)}` : "—";
    $("stats").innerHTML =
      `<span>Avg <b>${st.avg_p ?? "—"} W</b></span>` +
      `<span>NP <b>${st.np ?? "—"} W</b></span>` +
      `<span>Max <b>${st.max_p ?? "—"} W</b></span>` +
      `<span>Avg L/R <b>${avgBal}</b></span>` +
      `<span>Avg cad <b>${st.avg_c ?? "—"} rpm</b></span>` +
      (st.avg_hr != null ? `<span>Avg HR <b>${st.avg_hr} bpm</b></span><span>Max HR <b>${st.max_hr} bpm</b></span>` : "") +
      `<span>Work <b>${st.kj ?? "—"} kJ</b></span>` +
      `<span title="Estimated food energy burned, assuming ${st.efficiency || 24}% efficiency (set it on the Rides page).">Burned <b>≈ ${kcal(st.kj, st.efficiency) ?? "—"} kcal</b></span>` +
      (ftp ? `<span>IF <b>${st.if != null ? st.if.toFixed(2) : "—"}</b></span><span>TSS <b>${st.tss ?? "—"}</b></span>` : "");
    renderLaps(st);
    renderZones($("zonebar"), ftp ? st.zones : null);
    $("showH").hidden = !$("tiles").classList.contains("has-hr");

    renderStatus();
  }

  // Food energy burned, estimated from work: 1 kcal = 4.184 kJ and the body turns
  // about `eff` % of it into work at the pedals (24 % by default, so kcal ≈ kJ).
  // Set on the Rides page, as it varies from rider to rider.
  const kcal = (kj, eff) => kj == null ? null : Math.round(kj / (4.184 * (eff || 24) / 100));

  // ---------- time in zones (same markup on the Rides page)
  function renderZones(box, zones) {
    const total = zones ? zones.reduce((a, b) => a + b, 0) : 0;
    box.hidden = !total;
    if (!total) return;
    const names = ZONES.map(z => z[1]);
    box.innerHTML = `<div class="bar" role="img" aria-label="Time in power zones">` +
      zones.map((s, i) => s ? `<div style="flex:${s};background:var(--z${i + 1})" title="Z${i + 1} ${names[i]}: ${fmtTime(s)}"></div>` : "").join("") +
      `</div><div class="keys">` +
      zones.map((s, i) => s ? `<span style="--zc:var(--z${i + 1})">Z${i + 1} <b>${fmtTime(s)}</b> · ${Math.round(100 * s / total)}%</span>` : "").join("") +
      `</div>`;
  }

  // ---------- laps
  function renderLaps(st) {
    const lap = st.lap, laps = st.laps || [];
    // The lap line only once a lap has been pressed; before that it repeats the ride totals.
    $("lapline").innerHTML = lap && laps.length
      ? `<span>Lap <b>${lap.n}</b></span><span>Lap time <b>${fmtTime(lap.elapsed)}</b></span>` +
        `<span>Lap avg <b>${lap.avg_p} W</b></span>` +
        (lap.avg_hr != null ? `<span>Lap HR <b>${lap.avg_hr} bpm</b></span>` : "")
      : "";
    const box = $("laps");
    box.hidden = !laps.length;
    if (!laps.length) return;
    const hasHr = [...laps, lap].some(l => l && l.avg_hr != null);
    const ftp = st.ftp;
    const row = (l, now) => `<tr class="${now ? "now" : ""}"><td>${l.n}${now ? " (now)" : ""}</td>` +
      `<td>${fmtTime(l.elapsed)}</td><td>${l.avg_p} W</td><td>${l.np ?? "—"}${l.np != null ? " W" : ""}</td>` +
      `<td>${l.max_p} W</td>` + (ftp ? `<td>${l.if != null ? l.if.toFixed(2) : "—"}</td>` : "") +
      (hasHr ? `<td>${l.avg_hr ?? "—"}${l.avg_hr != null ? " bpm" : ""}</td>` : "") +
      `<td>${l.avg_c != null ? `${l.avg_c} rpm` : "—"}</td></tr>`;
    box.innerHTML = `<table><thead><tr><th>Lap</th><th>Time</th><th>Avg</th><th>NP</th><th>Max</th>` +
      (ftp ? `<th>IF</th>` : "") + (hasHr ? `<th>HR</th>` : "") + `<th>Cadence</th></tr></thead><tbody>` +
      laps.map(l => row(l, false)).join("") + (lap && lap.elapsed > 0 ? row(lap, true) : "") + `</tbody></table>`;
  }

  $("lap").onclick = () => {
    post("/api/lap");
    const b = $("lap");
    b.classList.add("flash"); setTimeout(() => b.classList.remove("flash"), 400);
  };

  // ---------- status line and warnings
  const STALE_MS = 5000;     // no sample for this long = the bike computer stopped updating
  let lastMsgAt = 0, linkDown = false;

  function renderStatus() {
    const dot = $("dot"), status = $("status");
    const stale = !linkDown && lastMsgAt && Date.now() - lastMsgAt > STALE_MS;
    const src = (latest && latest.source) || {};
    let text, cls = "";
    if (linkDown) {
      text = "Lost connection to the bike computer. Retrying…"; cls = "bad";
    } else if (stale) {
      text = "No data from the bike computer. The numbers are not updating."; cls = "bad";
    } else if (!latest) {
      text = "Connecting…";
    } else if (latest.connected) {
      text = latest.moving ? "Receiving" : "Connected · paused"; cls = "ok";
    } else {
      text = src.text || "Searching for pedals…"; cls = src.level === "error" ? "bad" : "";
    }
    status.textContent = text;
    dot.classList.toggle("ok", cls === "ok");
    dot.classList.toggle("bad", cls === "bad");
    const err = latest && !linkDown && !stale ? latest.log_error : null;
    $("alert").textContent = err ? `${err}. The dashboard keeps working, but this ride is not being saved.` : "";
    $("alert").classList.toggle("show", !!err);
  }
  setInterval(renderStatus, 1000);

  // ---------- chart
  const cv = $("cv"), ctx = cv.getContext("2d"), plot = $("plot"), tip = $("tip");
  const PAD = { l: 44, r: 54, t: 8, b: 24 };

  function visible() {
    if (!history.length) return [];
    if (!windowS) return history;
    const tEnd = history[history.length - 1].t;
    let i = history.length - 1;
    while (i > 0 && history[i - 1].t >= tEnd - windowS) i--;
    return history.slice(i);
  }

  // Average neighbouring samples so a long ride draws about one point per pixel.
  // Returns [points, k] where k = seconds per point (for finding pauses).
  function thin(data, maxPts) {
    if (data.length <= maxPts) return [data, 1];
    const k = Math.ceil(data.length / maxPts), out = [];
    for (let i = 0; i < data.length; i += k) {
      const chunk = data.slice(i, i + k), o = { t: chunk[0].t, lap: chunk[chunk.length - 1].lap };
      for (const key of ["p", "l", "r", "c", "h"]) {
        const v = chunk.map(d => d[key]).filter(x => x != null);
        o[key] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
      }
      out.push(o);
    }
    return [out, k];
  }

  function niceStep(max) {
    const raw = max / 5, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const m of [1, 2, 2.5, 5, 10]) if (m * mag >= raw) return m * mag;
    return 10 * mag;
  }

  function render() {
    renderNumbers();
    const dpr = window.devicePixelRatio || 1;
    const W = plot.clientWidth, H = plot.clientHeight;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const data = visible();
    const pw = W - PAD.l - PAD.r, ph = H - PAD.t - PAD.b;
    const tEnd = data.length ? data[data.length - 1].t : 0;
    const span = windowS || Math.max(60, tEnd - (data[0] ? data[0].t : 0));
    // Fill from the left until the ride is longer than the window, then scroll.
    const t0 = windowS ? Math.max(0, tEnd - windowS) : (data[0] ? data[0].t : 0);
    // The scales fit the lines shown in this window: power from 0 up to the highest
    // shown value (total, or a pedal line if it is higher), heart rate from its lowest
    // to its highest value in the window.
    let maxP = 0, minH = Infinity, maxH = 0;
    for (const d of data) {
      if (d.p > maxP) maxP = d.p;
      if (showL && d.l > maxP) maxP = d.l;
      if (showR && d.r > maxP) maxP = d.r;
      if (d.h != null) { if (d.h > maxH) maxH = d.h; if (d.h < minH) minH = d.h; }
    }
    maxP = Math.max(maxP, 50);                   // nothing shown yet: still a sensible scale
    const step = niceStep(maxP * 1.08);
    const yMax = Math.ceil(maxP * 1.08 / step) * step;
    cv.dataset.yMax = yMax;                      // read by the browser tests
    const x = t => PAD.l + (t - t0) / span * pw;
    const y = p => PAD.t + ph - (p / yMax) * ph;
    // Heart rate gets its own scale (no axis, the line is labelled): 10 bpm of room
    // on each side, rounded to 10, and at least 40 bpm from bottom to top.
    let hMin = Math.floor((minH - 10) / 10) * 10, hMax = Math.ceil((maxH + 10) / 10) * 10;
    if (hMax - hMin < 40) { const mid = (hMin + hMax) / 2; hMin = mid - 20; hMax = mid + 20; }
    const yh = h => PAD.t + ph - ((h - hMin) / (hMax - hMin)) * ph;

    // power zone bands (faint), with Z labels on the left inside the plot
    const ftp = latest && latest.stats ? latest.stats.ftp : null;
    if (ftp) {
      ctx.save();
      ctx.font = "11px system-ui, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
      let lo = 0;
      for (const [n, , hi] of ZONES) {
        const top = Math.min(hi * ftp, yMax);
        if (lo >= yMax) break;
        const y0 = y(lo), y1 = y(top);
        ctx.globalAlpha = .09; ctx.fillStyle = css(`--z${n}`);
        ctx.fillRect(PAD.l, y1, pw, y0 - y1);
        if (y0 - y1 > 14) {
          ctx.globalAlpha = .8; ctx.fillStyle = css("--text-muted");
          ctx.fillText(`Z${n}`, PAD.l + 4, (y0 + y1) / 2);
        }
        lo = top;
      }
      ctx.restore();
    }

    // grid + y labels
    ctx.font = "12px system-ui, sans-serif";
    ctx.fillStyle = css("--text-muted");
    ctx.strokeStyle = css("--grid");
    ctx.lineWidth = 1;
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (let v = 0; v <= yMax; v += step) {
      const yy = Math.round(y(v)) + .5;
      ctx.beginPath(); ctx.moveTo(PAD.l, yy); ctx.lineTo(PAD.l + pw, yy); ctx.stroke();
      ctx.fillText(v, PAD.l - 8, yy);
    }
    // x labels (elapsed time)
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    // Round time steps: about 4-8 labels, at 15 s, 1 min, ..., 1 h, 2 h.
    const xStep = [15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200].find(st => span / st <= 8) || 7200;
    for (let t = Math.ceil(Math.max(0, t0) / xStep) * xStep; t <= tEnd; t += xStep) {
      ctx.fillText(fmtTime(t), x(t), PAD.t + ph + 6);
    }

    if (data.length < 2) {
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = css("--text-muted"); ctx.font = "15px system-ui, sans-serif";
      ctx.fillText("Start pedalling — the graph fills in as you ride", PAD.l + pw / 2, PAD.t + ph / 2);
      tip.style.display = "none";
      return;
    }

    // lap starts: dashed vertical line with the lap number
    ctx.save();
    ctx.setLineDash([4, 4]); ctx.strokeStyle = css("--text-muted"); ctx.lineWidth = 1;
    ctx.fillStyle = css("--text-secondary"); ctx.font = "11px system-ui, sans-serif";
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    for (let i = 1; i < data.length; i++) {
      if (data[i].lap != null && data[i - 1].lap != null && data[i].lap !== data[i - 1].lap) {
        const xx = Math.round(x(data[i].t)) + .5;
        ctx.beginPath(); ctx.moveTo(xx, PAD.t); ctx.lineTo(xx, PAD.t + ph); ctx.stroke();
        ctx.fillText(`Lap ${data[i].lap}`, xx + 4, PAD.t + 2);
      }
    }
    ctx.restore();

    // series, drawn back-to-front: left, right, then total on top
    const hasHr = maxH > 0;
    const series = [
      { k: "h", color: css("--series-hr"),    name: "HR",    on: showH && hasHr, y: yh, unit: " bpm" },
      { k: "l", color: css("--series-left"),  name: "Left",  on: showL, y },
      { k: "r", color: css("--series-right"), name: "Right", on: showR, y },
      { k: "p", color: css("--series-total"), name: "Total", on: true,  y },
    ].filter(s => s.on);
    const [pts, k] = thin(data, Math.max(100, Math.round(pw * 1.5)));
    ctx.save();
    ctx.beginPath(); ctx.rect(PAD.l, PAD.t - 2, pw, ph + 4); ctx.clip();
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    for (const s of series) {
      ctx.strokeStyle = s.color; ctx.lineWidth = s.k === "h" ? 1.5 : 2;
      ctx.beginPath();
      let pen = false, prevT = null;
      for (const d of pts) {
        const v = d[s.k];
        // break the line across gaps (pauses) and missing balance values
        if (v == null || (prevT != null && d.t - prevT > 2.5 * k)) { pen = false; }
        if (v != null) { pen ? ctx.lineTo(x(d.t), s.y(v)) : ctx.moveTo(x(d.t), s.y(v)); pen = true; }
        prevT = d.t;
      }
      ctx.stroke();
    }
    ctx.restore();

    // direct labels at the right end of each line (text ink, coloured key), de-collided
    const last = data[data.length - 1];
    const labels = series.filter(s => last[s.k] != null)
      .map(s => ({ ...s, v: last[s.k], yy: s.y(last[s.k]) }))
      .sort((a, b) => a.yy - b.yy);
    for (let i = 1; i < labels.length; i++)
      if (labels[i].yy - labels[i - 1].yy < 15) labels[i].yy = labels[i - 1].yy + 15;
    ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.font = "600 12px system-ui, sans-serif";
    for (const lb of labels) {
      ctx.fillStyle = lb.color;
      ctx.fillRect(PAD.l + pw + 6, lb.yy - 1.5, 8, 3);
      ctx.fillStyle = css("--text-primary");
      ctx.fillText(Math.round(lb.v) + (lb.k === "h" ? "♥" : ""), PAD.l + pw + 18, lb.yy);
    }

    // hover / touch crosshair + tooltip
    if (hoverX != null && hoverX >= PAD.l && hoverX <= PAD.l + pw) {
      const tHover = t0 + (hoverX - PAD.l) / pw * span;
      let best = data[0];
      for (const d of data) if (Math.abs(d.t - tHover) < Math.abs(best.t - tHover)) best = d;
      const xx = Math.round(x(best.t)) + .5;
      ctx.strokeStyle = css("--text-muted"); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(xx, PAD.t); ctx.lineTo(xx, PAD.t + ph); ctx.stroke();
      for (const s of series) {
        if (best[s.k] == null) continue;
        ctx.beginPath(); ctx.arc(xx, s.y(best[s.k]), 4, 0, Math.PI * 2);
        ctx.fillStyle = s.color; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = css("--surface-1"); ctx.stroke();
      }
      const row = (k, v) => `<div class="row"><span>${k}</span><b>${v}</b></div>`;
      tip.innerHTML = `<div style="margin-bottom:4px;color:var(--text-muted)">${fmtTime(best.t)}</div>` +
        row("Total", `${best.p} W`) +
        row("Left", best.l == null ? "—" : `${best.l} W`) +
        row("Right", best.r == null ? "—" : `${best.r} W`) +
        row("Cadence", best.c == null ? "—" : `${best.c} rpm`) +
        (best.h != null ? row("Heart rate", `${best.h} bpm`) : "");
      tip.style.display = "block";
      const tw = tip.offsetWidth;
      tip.style.left = (xx + 12 + tw > W ? xx - 12 - tw : xx + 12) + "px";
      tip.style.top = PAD.t + "px";
    } else {
      tip.style.display = "none";
    }
  }

  const setHover = e => { const r = cv.getBoundingClientRect(); hoverX = e.clientX - r.left; render(); };
  cv.addEventListener("pointermove", setHover);
  cv.addEventListener("pointerdown", setHover);
  cv.addEventListener("pointerleave", () => { hoverX = null; render(); });
  // On a touch screen there is no "leave": hide the tooltip when the finger lifts.
  const endTouch = e => { if (e.pointerType !== "mouse") { hoverX = null; render(); } };
  cv.addEventListener("pointerup", endTouch);
  cv.addEventListener("pointercancel", endTouch);
  window.addEventListener("resize", render);
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", render);

  // ---------- data
  const MAX_HISTORY = 12 * 3600;     // same as the server: the whole ride
  let loading = false, pending = [];   // samples that arrive while the history loads

  function addSample(m) {
    // Skip samples the history already has (by moving time), so nothing is drawn twice.
    const last = history[history.length - 1];
    if (m.moving && (!last || m.t > last.t)) history.push({ t: m.t, p: m.p, l: m.l, r: m.r, c: m.c, h: m.h, lap: m.lap });
    if (history.length > MAX_HISTORY) history.splice(0, history.length - MAX_HISTORY);
  }

  async function loadHistory() {
    loading = true; pending = [];
    try {
      const r = await fetch("/api/history");
      const j = await r.json(), c = j.history || {};
      history = (c.t || []).map((t, i) => ({ t, p: c.p[i], l: c.l[i], r: c.r[i], c: c.c[i], h: c.h[i], lap: c.lap[i] }));
    } catch (e) {}
    loading = false;
    pending.forEach(addSample);        // samples that arrived meanwhile, after the history
    pending = [];
  }

  function connect() {
    const es = new EventSource("/events");
    es.onopen = () => { linkDown = false; lastMsgAt = Date.now(); sendClock(); loadHistory().then(render); };
    es.onmessage = ev => {
      lastMsgAt = Date.now();
      const m = JSON.parse(ev.data);
      if (m.type === "reset") { history = []; pending = []; latest = null; $("tiles").classList.remove("has-hr"); render(); return; }
      latest = m;
      if (loading) pending.push(m); else addSample(m);
      render();
    };
    es.onerror = () => { linkDown = true; renderStatus(); };
  }

  render();
  connect();
  setInterval(sendClock, 10 * 60 * 1000);   // in case the Pi's clock changes later

  // Keep the screen awake while the page is open (where supported).
  async function wake() { try { await navigator.wakeLock?.request("screen"); } catch (e) {} }
  wake();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
})();
</script>
</body>
</html>
